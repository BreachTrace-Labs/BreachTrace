# Isolated UI test database. Does not use the existing port-5432 database/volume.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: breachtrace_test
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run scripts/local_dev.py prepare first}
      POSTGRES_DB: breachtrace_local_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - local_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breachtrace_test -d breachtrace_local_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  local_test_pgdata:
